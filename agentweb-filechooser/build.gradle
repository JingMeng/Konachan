apply plugin: 'com.android.library'

android {
    namespace 'com.just.agentweb.filechooser'
    compileSdk 34
    defaultConfig {
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly 'com.google.android.material:material:1.2.1'
    implementation 'com.just.agentweb:agentweb:4.0.3-alpha@aar'
}

